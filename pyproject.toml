[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "test-automation-agent"
version = "0.1.0"
description = "Agente de Automação de Testes (Robot Framework + LLM Multimodal)"
readme = "README.md"
authors = [{ name = "Marcos Ferreira" }]
dependencies = [
    "robotframework>=7.0",
    "robotframework-browser>=18.0.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "google-genai>=0.1.0",
    "pytest>=8.0.0"
]

[project.scripts]
agent-rf = "agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

