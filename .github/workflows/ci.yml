name: CI - Test Automation Agent

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & Initialize Robot Framework Browser
        run: |
          playwright install chromium --with-deps
          rfbrowser init --skip-browsers
          # Ensure Robot Framework Browser can locate Playwright Chromium
          PLAYWRIGHT_CORE_DIR=$(python -c "import Browser, pathlib; print(pathlib.Path(Browser.__file__).parent / 'wrapper' / 'node_modules' / 'playwright-core')")
          mkdir -p "$PLAYWRIGHT_CORE_DIR/.local-browsers"
          ln -sf ~/.cache/ms-playwright/* "$PLAYWRIGHT_CORE_DIR/.local-browsers/" || true

      - name: Install Package in Editable Mode
        run: |
          pip install -e . --no-build-isolation --no-deps

      - name: Run Unit Tests with Coverage (Min. 80%)
        run: |
          pytest --cov=src/agent --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Run Smoke CLI Verification
        run: |
          agent-rf --help
          agent-rf inspect "file://$(pwd)/demo_app/v1/index.html" --output-dir ./smoke_inspect
          agent-rf diff "file://$(pwd)/demo_app/v1/index.html" "file://$(pwd)/demo_app/v2/index.html" --output-dir ./smoke_diff --run

