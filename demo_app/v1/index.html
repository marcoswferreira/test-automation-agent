<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal de Demonstração - v1</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; }
    header { border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; }
    h1 { margin: 0 0 8px 0; color: #0f172a; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input[type="text"], input[type="email"], select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button.btn-primary { background: #2563eb; color: #ffffff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button.btn-primary:hover { background: #1d4ed8; }
    .status-box { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
    .status-box.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .product-card { border: 1px solid #e2e8f0; border-radius: 6px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="portal-title">Loja Virtual Demo - V1 Baseline</h1>
      <p>Ambiente para teste de automação com Robot Framework</p>
    </header>

    <section id="login-section">
      <h2>Acesso do Cliente</h2>
      <div class="form-group">
        <label for="username">Nome de Usuário:</label>
        <input type="text" id="username" name="username" placeholder="Digite seu usuário" data-testid="input-username" />
      </div>
      <div class="form-group">
        <label for="user-email">E-mail Corporativo:</label>
        <input type="email" id="user-email" name="user-email" placeholder="nome@empresa.com" data-testid="input-email" />
      </div>
    </section>

    <section id="order-section">
      <h2>Seleção de Serviço</h2>
      <div class="product-card" data-testid="item-plan-pro">
        <div>
          <strong>Plano Profissional</strong>
          <div>Assinatura mensal de testes automatizados</div>
        </div>
        <button type="button" class="btn-primary" id="select-plan-btn" data-testid="btn-select-plan" onclick="selectPlan('Profissional')">Selecionar</button>
      </div>

      <div class="form-group">
        <label for="plan-selected">Plano Escolhido:</label>
        <input type="text" id="plan-selected" readonly placeholder="Nenhum selecionado" data-testid="input-selected-plan" />
      </div>

      <button type="button" class="btn-primary" id="submit-order-btn" data-testid="btn-submit-order" onclick="submitOrder()">Confirmar Pedido</button>
      <div id="order-feedback" class="status-box" data-testid="status-message"></div>
    </section>
  </div>

  <script>
    function selectPlan(plan) {
      document.getElementById('plan-selected').value = plan;
    }
    function submitOrder() {
      const user = document.getElementById('username').value.trim();
      const plan = document.getElementById('plan-selected').value.trim();
      const feedback = document.getElementById('order-feedback');
      if (!user || !plan) {
        alert('Por favor, preencha o nome do usuário e selecione um plano.');
        return;
      }
      feedback.style.display = 'block';
      feedback.className = 'status-box success';
      feedback.textContent = `Pedido confirmado com sucesso para ${user}! Plano: ${plan}.`;
    }
  </script>
</body>
</html>
